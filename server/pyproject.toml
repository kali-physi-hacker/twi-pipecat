[project]
name = "twi-env"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
# onnxruntime, a pipecat-ai dependency, has no Python 3.15 wheels yet.
requires-python = ">=3.11,<3.15"
dependencies = [
    "pipecat-ai[evals,livekit,openai,runner,silero,webrtc,whisper]>=1.12.0",
    "pipecatcloud",
    "pipecat-ai-whisker",
    "numpy>=2.4.6",
    "mlx-whisper>=0.4.3",
    "voxcpm>=1.5.0",
    "fastapi>=0.165.0",
    "faster-whisper>=1.2.1",
    "ctranslate2",
]

[dependency-groups]
dev = ["pyright>=1.1.404,<2", "ruff>=0.12.11,<1"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
